<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento de Treinos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Gerenciamento de Treinos</h1>
        <p>Organize seus exercícios e acompanhe seus treinos.</p>
    </header>

    <main>
        <section>
            <h2>Meus Treinos</h2>
            <button>Adicionar treino</button>
        </section>

        <section>
    		<h2>Exercícios</h2>

    		<input type="text" id="nomeExercicio" placeholder="Nome do exercício">
    		<button onclick="adicionarExercicio()">Adicionar exercício</button>

    		<ul id="listaExercicios"></ul>
	</section>

        <section>
            <h2>Treinos concluídos</h2>
            <button>Registrar treino</button>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
